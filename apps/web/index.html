<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme & PWA -->
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MiraCulture" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Search Console ownership -->
    <meta name="google-site-verification" content="SFqFH-0_1pghuvxcQf3x_QsS4LYTOwaTE0i7iuJPrs4" />

    <!-- Per-page tags. server.cjs replaces this block with the requested page's
         title, description, canonical, robots, Open Graph, Twitter and JSON-LD
         (facts in src/seo/site.mjs); data-rh lets react-helmet-async take them
         over in the browser without duplicates. Defaults below are the home page's. -->
    <!-- seo:start -->
    <title>MiraCulture — Fan-Powered Concert Tickets | $5 Raffle Entry</title>
    <meta name="description" content="Fans worldwide buy tickets at face value to support artists. Local fans win those tickets through fair, cryptographic raffles for just $5. No scalpers. No bots." data-rh="true" />
    <link rel="canonical" href="https://www.mira-culture.com/" data-rh="true" />
    <meta name="robots" content="index, follow" data-rh="true" />
    <!-- seo:end -->
    <meta name="keywords" content="fan-powered tickets, concert ticket raffle, face value tickets, anti-scalper tickets, support artists, cheap concert tickets, cryptographic raffle, live music tickets" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:creator" content="@MiraCulture" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Fonts: preconnect early, then load stylesheet with preload for non-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" /></noscript>

    <!-- DNS prefetch for third-party origins the app may contact -->
    <link rel="dns-prefetch" href="https://js.stripe.com" />

    <!-- Site-wide JSON-LD (Organization is rendered per page on the home page) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MiraCulture",
      "url": "https://www.mira-culture.com/",
      "description": "Fan-powered concert tickets. Fans buy tickets at face value to support artists. Local fans win through cryptographic raffles for $5."
    }
    </script>
  </head>
  <body class="bg-noir-950 text-gray-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
